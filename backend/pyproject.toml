[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bmim-backend"
version = "1.0.0"
description = "BMIM – Bharat Material Intelligence Network Backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "python-multipart>=0.0.9",

    # Database
    # psycopg (v3, binary) is required for Supabase + pgvector's asyncpg path.
    # psycopg2-binary is intentionally removed; psycopg3 supersedes it.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",

    # Supabase client (Python SDK v2)
    "supabase>=2.9.0",
    "httpx>=0.27.2",

    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # Security
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",

    # AI / ML
    # NOTE: torch is NOT listed here to avoid accidentally pulling CUDA packages.
    # Install CPU-only torch first using requirements-cpu.txt, then install this project.
    "sentence-transformers>=3.3.0",
    "rapidfuzz>=3.10.0",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "numpy>=1.26.4",

    # Utilities
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
